<div class="nav-items">
  {%- assign nav_pages = site.pages | where: "nav", true | sort: "nav_order" -%}
  {%- for hyperpage in nav_pages -%}
  {%- if hyperpage.nav_title %}
  <a class="nav-item" href="{{ hyperpage.url | relative_url }}">{{ hyperpage.nav_title | escape }}</a>
  {%- else if hyperpage.title %}
  <a class="nav-item" href="{{ hyperpage.url | relative_url }}">{{ hyperpage.title | escape }}</a>
  {%- endif -%}
  {%- endfor %}
</div>
